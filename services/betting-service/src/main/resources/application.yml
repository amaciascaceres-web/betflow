server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: betting-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/betflow?currentSchema=betting
    username: ${POSTGRES_USER:betflow}
    password: ${POSTGRES_PASSWORD:betflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: betting

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      # One group per bounded context. Every instance of this service joins it, so the six
      # partitions are shared out between them; a second consumer group would get its own full
      # copy of the stream instead, which is what makes a fact readable by services that do not
      # know about each other.
      group-id: betting-service-group
      # Only applies when the group has no committed offset: on its very first start it reads the
      # topic from the beginning rather than from the tail. 'latest' would silently skip
      # everything published before this service existed.
      auto-offset-reset: earliest
    listener:
      # The default is BATCH — the container commits after the listener returns for the whole
      # polled batch. MANUAL moves that to an explicit acknowledge() call, so the offset is
      # advanced by the code that knows whether the work actually succeeded. See ADR-003.
      ack-mode: MANUAL

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

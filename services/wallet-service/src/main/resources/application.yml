server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: wallet-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/betflow?currentSchema=wallet
    username: ${POSTGRES_USER:betflow}
    password: ${POSTGRES_PASSWORD:betflow}
    hikari:
      # Sets the connection's search_path, so an unqualified table name resolves to this
      # service's schema without hard-coding the schema into any SQL.
      schema: wallet
  flyway:
    enabled: true
    schemas: wallet
    default-schema: wallet
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. 'validate' turns any drift between an entity and its migration
      # into a startup failure instead of a bug found at runtime.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: wallet

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
